name: "Build, Sign, and Release Lotus"

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag for this release'
        required: true
      skip_signing:
        description: 'Skip SignPath signing (for testing)'
        type: boolean
        default: false

jobs:
  # Building Lotus and VF
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lotus
        uses: actions/checkout@v4
        with:
          path: Lotus
          fetch-depth: 0

      - name: Checkout VentFramework-Continued
        uses: actions/checkout@v4
        with:
          repository: Lotus-AU/VentFramework-Continued
          path: VentFramework-Continued

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build VentFramework-Continued
        working-directory: VentFramework-Continued
        run: dotnet build -c Debug

      - name: Restore Lotus
        working-directory: Lotus
        run: dotnet restore Lotus.csproj /p:Platform=AnyCPU

      - name: Build Lotus
        working-directory: Lotus
        run: dotnet build Lotus.csproj -c Release /p:Platform=AnyCPU /p:Debug=true

      - name: Upload unsigned Lotus artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotus-unsigned
          path: Lotus/bin/Release/net6.0/Lotus.dll
          if-no-files-found: error

      - name: Upload unsigned VentFrameworkContinued artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventframework-unsigned
          path: VentFramework-Continued/bin/Debug/net6.0/VentFrameworkContinued.dll
          if-no-files-found: error

  # Sign w/ SignPath
  sign:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ inputs.skip_signing != true }}
    steps:
      - name: Download unsigned Lotus artifact
        uses: actions/download-artifact@v4
        with:
          name: lotus-unsigned
          path: signing

      - name: Download unsigned VentFrameworkContinued artifact
        uses: actions/download-artifact@v4
        with:
          name: ventframework-unsigned
          path: signing

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input
          path: |
            signing/Lotus.dll
            signing/VentFrameworkContinued.dll
          if-no-files-found: error

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 384cca6e-a42e-4b04-a3bf-cb751b4edc3f
          project-slug: LotusContinued
          signing-policy-slug: test-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          name: signed-binaries
          path: signed/*
          
  skip-sign:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: ${{ inputs.skip_signing == true }}
    steps:
      - name: Download unsigned Lotus artifact
        uses: actions/download-artifact@v4
        with:
          name: lotus-unsigned
          path: signed

      - name: Download unsigned VentFrameworkContinued artifact
        uses: actions/download-artifact@v4
        with:
          name: ventframework-unsigned
          path: signed

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@v4
        with:
          name: signed-binaries
          path: signed/*
          if-no-files-found: error

# Package for release
  package:
    runs-on: ubuntu-latest
    needs: [ sign, skip-sign ]
    if: ${{ always() && (needs.sign.result == 'success' || needs.skip-sign.result == 'success') }}
    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@v4
        with:
          name: signed-binaries
          path: artifacts/signed

      - name: Prepare release folders
        run: |
          mkdir -p epic steam

      - name: Download BepInEx Zip Files
        run: |
          curl -L https://raw.githubusercontent.com/Lotus-AU/BepInExZips/refs/heads/main/x64.zip -o x64.zip
          curl -L https://raw.githubusercontent.com/Lotus-AU/BepInExZips/refs/heads/main/x86.zip -o x86.zip
          unzip x64.zip -d epic
          unzip x86.zip -d steam

      - name: Copy signed DLLs to plugins
        run: |
          mkdir -p epic/BepInEx/plugins steam/BepInEx/plugins
          cp artifacts/signed/Lotus.dll epic/BepInEx/plugins/
          cp artifacts/signed/VentFrameworkContinued.dll epic/BepInEx/plugins/
          cp artifacts/signed/Lotus.dll steam/BepInEx/plugins/
          cp artifacts/signed/VentFrameworkContinued.dll steam/BepInEx/plugins/

      - name: Download Translation Files
        run: |
          curl -L https://github.com/Lotus-AU/Languages/archive/refs/heads/new_translations.zip -o translations.zip
          unzip translations.zip

      - name: Copy translations
        run: |
          mkdir -p epic/Languages/Lotus steam/Languages/Lotus
          find Languages-new_translations -maxdepth 1 -type f \( -iname '*.yaml' \) -exec cp {} epic/Languages/Lotus/ \;
          find Languages-new_translations -maxdepth 1 -type f \( -iname '*.yaml' \) -exec cp {} steam/Languages/Lotus/ \;

      - name: Create Epic/MS Store ZIP
        run: |
          cd epic
          zip -r "../Lotus.${{ inputs.version }}.Epic+MicrosoftStore.zip" .

      - name: Create Steam ZIP
        run: |
          cd steam
          zip -r "../Lotus.${{ inputs.version }}.Steam.zip" .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-zips
          path: ./Lotus*.zip
          if-no-files-found: error
  
  release:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - name: Download Release Zip Files
        uses: actions/download-artifact@v4
        with:
          name: final-zips
          path: release-artifacts/zips
            
      - name: Download signed binaries
        uses: actions/download-artifact@v4
        with:
          name: signed-binaries
          path: release-artifacts/signed

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Project Lotus: v${{ inputs.version }}"
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            release-artifacts/zips/*
            release-artifacts/signed/Lotus.dll
            release-artifacts/signed/VentFrameworkContinued.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# partial credit to EHR for helping me figure out how to do this
# https://github.com/Gurge44/EndlessHostRoles/blob/21310dc2dd861fbac2f7bcfd63c47d1c3c6e9764/.github/workflows/release.yml